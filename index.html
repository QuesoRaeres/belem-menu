<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belém — Menú Digital</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e74c3c;
        }
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-bottom: 80px;
        }
        .header-bg {
            background: linear-gradient(135deg, var(--primary-color), #34495e);
            color: white;
            padding: 2.5rem 1rem;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .nav-pills .nav-link.active {
            background-color: var(--accent-color);
        }
        .nav-pills .nav-link {
            color: var(--primary-color);
            font-weight: 600;
        }
        .card-menu {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: transform 0.2s;
        }
        .card-menu:hover {
            transform: translateY(-2px);
        }
        .price-badge {
            font-size: 1.1rem;
            color: var(--accent-color);
            font-weight: bold;
        }
        .btn-add {
            background-color: var(--primary-color);
            color: white;
            border-radius: 20px;
        }
        .btn-add:hover {
            background-color: var(--accent-color);
            color: white;
        }
    </style>
</head>
<body>

    <!-- Encabezado / Branding de Belém -->
    <header class="header-bg text-center mb-4">
        <h1 class="fw-bold display-5">Belém</h1>
        <p class="mb-0 text-white-50">Menú Digital & Pedidos en Línea</p>
    </header>

    <div class="container">
        <!-- Navegación por Categorías -->
        <ul class="nav nav-pills justify-content-center mb-4 gap-2" id="pills-tab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="pills-especiales-tab" data-bs-toggle="pill" data-bs-target="#pills-especiales" type="button" role="tab">Especiales</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="pills-bebidas-tab" data-bs-toggle="pill" data-bs-target="#pills-bebidas" type="button" role="tab">Bebidas</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="pills-postres-tab" data-bs-toggle="pill" data-bs-target="#pills-postres" type="button" role="tab">Postres</button>
            </li>
        </ul>

        <!-- Contenido de las Categorías -->
        <div class="tab-content" id="pills-tabContent">
            
            <!-- Categoría: Especiales -->
            <div class="tab-pane fade show active" id="pills-especiales" role="tabpanel">
                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <div class="card card-menu p-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <h5 class="fw-bold mb-1">Especial Belém</h5>
                                    <p class="text-muted small mb-2">Ingredientes selectos de la casa preparados al momento.</p>
                                    <span class="price-badge">$150 MXN</span>
                                </div>
                                <button class="btn btn-add btn-sm px-3 ms-2" onclick="agregarAlPedido('Especial Belém', 150)">
                                    <i class="bi bi-plus-lg"></i> Agregar
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Categoría: Bebidas -->
            <div class="tab-pane fade" id="pills-bebidas" role="tabpanel">
                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <div class="card card-menu p-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <h5 class="fw-bold mb-1">Café Artesanal</h5>
                                    <p class="text-muted small mb-2">Grano recién molido 250ml.</p>
                                    <span class="price-badge">$45 MXN</span>
                                </div>
                                <button class="btn btn-add btn-sm px-3 ms-2" onclick="agregarAlPedido('Café Artesanal', 45)">
                                    <i class="bi bi-plus-lg"></i> Agregar
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Categoría: Postres -->
            <div class="tab-pane fade" id="pills-postres" role="tabpanel">
                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <div class="card card-menu p-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <h5 class="fw-bold mb-1">Pastel Belém</h5>
                                    <p class="text-muted small mb-2">Rebanada de pastel artesanal tradicional.</p>
                                    <span class="price-badge">$65 MXN</span>
                                </div>
                                <button class="btn btn-add btn-sm px-3 ms-2" onclick="agregarAlPedido('Pastel Belém', 65)">
                                    <i class="bi bi-plus-lg"></i> Agregar
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Barra flotante para hacer pedido por WhatsApp -->
    <div class="fixed-bottom bg-white border-top p-3 shadow-lg">
        <div class="container d-flex justify-content-between align-items-center">
            <div>
                <small class="text-muted d-block">Total estimado:</small>
                <span id="total-precio" class="fw-bold fs-5 text-success">$0 MXN</span>
            </div>
            <button class="btn btn-success fw-bold px-4 rounded-pill" onclick="enviarWhatsApp()">
                <i class="bi bi-whatsapp"></i> Pedir por WhatsApp (<span id="total-items">0</span>)
            </button>
        </div>
    </div>

    <!-- Scripts de Bootstrap y lógica JS básica -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let carrito = [];
        let total = 0;
        const TELEFONO_WHATSAPP = "521234567890"; // Reemplaza con tu número a 10 dígitos (ej. 52 + 10 dígitos)

        function agregarAlPedido(nombre, precio) {
            carrito.push({ nombre, precio });
            total += precio;
            actualizarUI();
        }

        function actualizarUI() {
            document.getElementById('total-precio').innerText = `$${total} MXN`;
            document.getElementById('total-items').innerText = carrito.length;
        }

        function enviarWhatsApp() {
            if (carrito.length === 0) {
                alert("Por favor agrega al menos un producto a tu pedido.");
                return;
            }

            let mensaje = "¡Hola! Quisiera realizar el siguiente pedido desde el menú web de *Belém*:\n\n";
            carrito.forEach((item, index) => {
                mensaje += `${index + 1}. ${item.nombre} - $${item.precio} MXN\n`;
            });
            mensaje += `\n*Total a pagar:* $${total} MXN`;

            const url = `https://wa.me/${TELEFONO_WHATSAPP}?text=${encodeURIComponent(mensaje)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
